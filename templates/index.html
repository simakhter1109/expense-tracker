<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Pockit Monee</h1>

    <section>
        <h2>The Damage Limit</h2>
        <input type="number" id="budgetInput" placeholder="Enter total budget">
        <button id="setBudgetBtn">Set Budget</button>
    </section>

    <section>
        <h2>Reality Check</h2>
        <p>Total Budget: ₹<span id="totalBudget">0</span></p>
        <p>Total Spent: ₹<span id="totalSpent">0</span></p>
        <p>Remaining: ₹<span id="remaining">0</span></p>
    </section>

<section>
    <h2>Oops, Spent</h2>
    <input type="text" id="expenseTitle" placeholder="Title (e.g. Groceries)">
    <input type="number" id="expenseAmount" placeholder="Amount">
    <button id="addExpenseBtn">Add Expense</button>
</section>

<section>
    <h2>The Damages</h2>
    <ul id="expenseList">
    </ul>
</section>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
