<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Expense Tracker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Pockit Monee</h1>

<section>
    <h2>The Damage Limit</h2>
    <div class="form-row">
        <input type="number" id="budgetInput" placeholder="Enter total budget">
        <button id="setBudgetBtn">Set Budget</button>
    </div>
</section>

<section>
    <h2>Summary</h2>
    <div class="summary-box-row">
        <div class="label">Total Budget</div>
        <div class="stat-number">₹<span id="totalBudget">0</span></div>
    </div>
    <div class="summary-box-row">
        <div class="label">Total Spent</div>
        <div class="stat-number">₹<span id="totalSpent">0</span></div>
    </div>
    <div class="summary-box-row">
        <div class="label">Remaining</div>
        <div class="stat-number">₹<span id="remaining">0</span></div>
    </div>
</section>

<section>
    <h2>Oops, Spent</h2>
    <div class="form-row">
        <input type="text" id="expenseTitle" placeholder="Title (e.g. Groceries)">
        <input type="number" id="expenseAmount" placeholder="Amount">
        <button id="addExpenseBtn">Add Expense</button>
    </div>
</section>

<section>
    <h2>The Damages</h2>
    <ul id="expenseList">
    </ul>
</section>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
